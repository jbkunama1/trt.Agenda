<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/themes.css"><link rel="stylesheet" href="/static/themes-extra.css"><link rel="stylesheet" href="/static/layouts.css"><script src="/static/themes.js"></script><script src="/static/app.js" defer></script><script src="/static/export.js" defer></script><script src="/static/copy.js" defer></script></head><body><main><header><div><span class="eyebrow">SCHRITT FÜR SCHRITT</span><h1 id="heading">Agenda</h1><p id="summary"></p></div><div class="toolbar"><label>Agenda auswählen<select id="agenda-select" aria-label="Agenda auswählen"></select></label><div class="toolbar-buttons"><a id="view-link" class="ghost button-link" href="/static/view.html" target="_blank" rel="noopener">View ↗</a><button id="copy-link" class="ghost" title="View-Link in die Zwischenablage kopieren">🔗 Link</button><button id="copy-iframe" class="ghost" title="Fertigen iFrame-Code kopieren">&lt;/&gt; iFrame</button><button id="edit" class="ghost">Bearbeiten</button><button id="export-pdf" class="ghost" title="Gespeicherte Agenda als farbiges PDF">PDF ↓</button><button id="export-jpg" class="ghost" title="Gespeicherte Agenda als farbiges JPG">JPG ↓</button></div><small>Export: zuletzt gespeicherter Stand</small></div></header><section id="editor" hidden><label>Bearbeitungsschlüssel<input id="key" type="password" autocomplete="off"></label><div class="settings"><label>Titel<input id="title" maxlength="120" required></label><label>Startzeit<input id="start" type="time" required></label><label>Theme dieser Agenda<select id="theme-select"><optgroup label="Klassisch"><option value="ocean">Ocean</option><option value="graphite">Graphite</option><option value="paper">Paper</option><option value="forest">Forest</option><option value="sunset">Sunset</option></optgroup><optgroup label="Neu"><option value="70s">70s</option><option value="80s">80s</option><option value="90s">90s</option><option value="modern">Modern</option><option value="cyberpunk">Cyberpunk</option><option value="neon">Neon</option><option value="terminal">Terminal</option><option value="pastell">Pastell</option></optgroup></select></label><label>Layout<select id="layout-select"><option value="list">Liste</option><option value="columns">Spalten</option><option value="timeline">Nebeneinander (Zeitleiste)</option><option value="tiles">Kacheln</option></select></label></div><p class="hint">Theme, Layout und Agenda werden gemeinsam in der Datenbank gespeichert. Das Layout wird nach dem Speichern angezeigt; im Editor bleibt die Liste sichtbar. Emoji pro Punkt ersetzt die Nummer.</p></section><ol id="list"></ol><section id="actions" hidden><button id="add" class="ghost">+ Punkt hinzufügen</button><button id="save">Speichern</button><button id="cancel" class="ghost">Abbrechen</button></section><p id="status" role="status"></p><footer>Ein Schritt nach dem anderen.</footer></main></body></html>
